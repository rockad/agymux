# agymux.conf: OpenCode-style top tab bar & bilingual keybindings for agymux
# Inherits parent terminal emulator and tmux colors cleanly by default.

# -----------------------------------------------------------------------------
# 1. Top Tab Strip Styling (Inheriting Terminal Colors)
# -----------------------------------------------------------------------------
set -g status-position top
set -g status 2
set -g "status-format[1]" "#[bg=default,fill= ] "
set -g status-interval 1

# Base statusbar style: Inherit terminal foreground and background
set -g status-style "bg=default,fg=default"

# Window focus hook to auto-clear external sync alert
set-hook -g pane-focus-in "set-option -w @external_sync 0"

# Left section: Dynamic Prefix indicator (only appears when Prefix is engaged)
set -g status-left-length 40
set -g status-left "#{?#{client_prefix},#[fg=black]#[bg=brightred]#[bold] 󰘳 PREFIX #[default] ,}"

# Tab formatting: Flat highlighted tabs (zero round corners)
setw -g window-status-separator " "

# Inactive tab: distinct dark slate background (colour237) with soft text (colour250), status icons, and close button
setw -g window-status-format "#{?#{||:#{window_activity_flag},#{window_bell_flag}},#[fg=colour16]#[bg=colour220]#[bold] 󰂞 #I #{=22:window_name}#{?#{@remote_control}, 󰢹,}#[range=user|close] 󰅖#[norange] #[default],#{?#{@external_sync},#[fg=colour39]#[bg=colour237]#[bold] 󰛌 #I #{=22:window_name}#{?#{@remote_control}, 󰢹,}#[range=user|close] 󰅖#[norange] #[default],#[fg=colour250]#[bg=colour237] #I #{=22:window_name}#{?#{@remote_control}, #[fg=colour75]󰢹#[fg=colour250],}#[range=user|close] #[fg=colour244]󰅖#[fg=colour250]#[norange] #[default]}}"

# Active tab: clean high-contrast highlight using muted teal (colour73) with dark ink text (colour234)
setw -g window-status-current-format "#[fg=colour234]#[bg=colour73]#[bold] #I #{=22:window_name}#{?#{@remote_control}, 󰢹,}#[range=user|close] 󰅖#[norange] #[default]"

# Right section: Running turn indicator, project · time · date
set -g status-right-length 70
set -g status-right "#{?#{@agy_running},#[fg=yellow,bold]● RUNNING  ,}#[fg=magenta]#S #[fg=white]· #[fg=white]%H:%M #[fg=white]· #[fg=white]%Y-%m-%d #[default]"

# -----------------------------------------------------------------------------
# 2. Prefix Definition (Ctrl+Space)
# -----------------------------------------------------------------------------
set -g prefix C-Space
bind-key C-Space send-prefix

# -----------------------------------------------------------------------------
# 3. Direct Tab Navigation (Alt + 1..9 / Arrows & Prefix + 1..9 / Arrows)
# -----------------------------------------------------------------------------
# Root-table prefix-less Alt tab navigation
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

bind-key -n M-Left  previous-window
bind-key -n M-Right next-window

# Prefix tab navigation
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9

bind-key Left  previous-window
bind-key Right next-window

# -----------------------------------------------------------------------------
# 4. Paired Bilingual Keybindings (English & RussianWin Layout Resilience)
# -----------------------------------------------------------------------------
# Switch Tab / Session (Ctrl+Space b / B / и / И)
bind-key b display-popup -E -w 85% -h 75% "agymux switch"
bind-key B display-popup -E -w 85% -h 75% "agymux switch"
bind-key и display-popup -E -w 85% -h 75% "agymux switch"
bind-key И display-popup -E -w 85% -h 75% "agymux switch"

# Switch Project (Ctrl+Space p / P / з / З)
bind-key p display-popup -E -w 85% -h 70% "agymux project"
bind-key P display-popup -E -w 85% -h 70% "agymux project"
bind-key з display-popup -E -w 85% -h 70% "agymux project"
bind-key З display-popup -E -w 85% -h 70% "agymux project"

# Actions / Command Palette (Ctrl+Space a / A / ф / Ф)
bind-key a display-popup -E -w 75% -h 60% "agymux palette"
bind-key A display-popup -E -w 75% -h 60% "agymux palette"
bind-key ф display-popup -E -w 75% -h 60% "agymux palette"
bind-key Ф display-popup -E -w 75% -h 60% "agymux palette"

# Keyboard Shortcuts Cheatsheet Modal (Ctrl+Space ? / h / H / р / Р)
bind-key ? display-popup -E -w 75% -h 70% "agymux helper"
bind-key h display-popup -E -w 75% -h 70% "agymux helper"
bind-key H display-popup -E -w 75% -h 70% "agymux helper"
bind-key р display-popup -E -w 75% -h 70% "agymux helper"
bind-key Р display-popup -E -w 75% -h 70% "agymux helper"

# New Tab (Ctrl+Space c / C / с / С)
bind-key c new-window -n "+ new" "agymux run"
bind-key C new-window -n "+ new" "agymux run"
bind-key с new-window -n "+ new" "agymux run"
bind-key С new-window -n "+ new" "agymux run"

# New Worktree Tab (Ctrl+Space w / W / ц / Ц)
bind-key w display-popup -E -w 65% -h 35% "agymux palette worktree"
bind-key W display-popup -E -w 65% -h 35% "agymux palette worktree"
bind-key ц display-popup -E -w 65% -h 35% "agymux palette worktree"
bind-key Ц display-popup -E -w 65% -h 35% "agymux palette worktree"

# Rename Tab (Ctrl+Space r / R / к / К)
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key R command-prompt -I "#W" "rename-window '%%'"
bind-key к command-prompt -I "#W" "rename-window '%%'"
bind-key К command-prompt -I "#W" "rename-window '%%'"

# Fork Tab / Conversation (Ctrl+Space f / F / а / А)
bind-key f display-popup -E -w 65% -h 35% "agymux palette fork"
bind-key F display-popup -E -w 65% -h 35% "agymux palette fork"
bind-key а display-popup -E -w 65% -h 35% "agymux palette fork"
bind-key А display-popup -E -w 65% -h 35% "agymux palette fork"

# Launch with Custom Flags (Ctrl+Space l / L / д / Д)
bind-key l display-popup -E -w 75% -h 55% "agymux palette flags"
bind-key L display-popup -E -w 75% -h 55% "agymux palette flags"
bind-key д display-popup -E -w 75% -h 55% "agymux palette flags"
bind-key Д display-popup -E -w 75% -h 55% "agymux palette flags"

# Close Tab (Ctrl+Space x / X / ч / Ч)
bind-key x confirm-before -p "Close tab #W? (y/n)" kill-window
bind-key X confirm-before -p "Close tab #W? (y/n)" kill-window
bind-key ч confirm-before -p "Close tab #W? (y/n)" kill-window
bind-key Ч confirm-before -p "Close tab #W? (y/n)" kill-window

# Detach Session (Ctrl+Space d / D / в / В)
bind-key d detach-client
bind-key D detach-client
bind-key в detach-client
bind-key В detach-client

# Kill Session (Ctrl+Space k / K / л / Л)
bind-key k confirm-before -p "Kill session #S? (y/n)" kill-session
bind-key K confirm-before -p "Kill session #S? (y/n)" kill-session
bind-key л confirm-before -p "Kill session #S? (y/n)" kill-session
bind-key Л confirm-before -p "Kill session #S? (y/n)" kill-session

# New Plain Terminal Tab (Ctrl+Space t / T / е / Е)
bind-key t new-window -n "term" "$SHELL"
bind-key T new-window -n "term" "$SHELL"
bind-key е new-window -n "term" "$SHELL"
bind-key Е new-window -n "term" "$SHELL"

# Switch to Main Terminal Session (Ctrl+Space m / M / ь / Ь)
bind-key m run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
bind-key M run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
bind-key ь run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
bind-key Ь run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"

# -----------------------------------------------------------------------------
# 5. Mouse Interactions for Tabs (OpenCode Ergonomics & Protection)
# -----------------------------------------------------------------------------
bind-key -T root MouseDown1Status if-shell -F '#{==:#{mouse_status_range},close}' {
    if-shell -F '#{>:#{session_windows},1}' {
        kill-window -t =
    } {
        confirm-before -p "Close final tab #W? (y/n)" "kill-window -t ="
    }
} {
    switch-client -t =
}

bind-key -T root MouseDown2Status if-shell -F '#{>:#{session_windows},1}' {
    kill-window -t =
} {
    confirm-before -p "Close final tab #W? (y/n)" "kill-window -t ="
}

bind-key -T root MouseDown3Status display-menu -t = -T "#W Actions" \
    "Close Tab" x "if-shell -F '#{>:#{session_windows},1}' { kill-window -t = } { confirm-before -p \"Close final tab #W? (y/n)\" \"kill-window -t =\" }" \
    "Rename Tab" r "command-prompt -I '#W' 'rename-window -t = %%'" \
    "Fork Tab" f "display-popup -E -w 65% -h 35% 'agymux palette fork'" \
    "Reload Session" R "run-shell 'agymux palette -a reload'"

