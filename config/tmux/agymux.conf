# agymux.conf: OpenCode-style top tab bar & bilingual keybindings for agymux
# Inherits parent terminal emulator and tmux colors cleanly by default.

# -----------------------------------------------------------------------------
# 1. Top Tab Strip Styling (Inheriting Terminal Colors)
# -----------------------------------------------------------------------------
set -g status-position top
set -g status-interval 1

# Base statusbar style: Inherit terminal foreground and background
set -g status-style "bg=default,fg=default"

# Left section: Project/Session pill or Prefix indicator (inherits terminal colors)
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[reverse,bold] 󰘳 PREFIX #[default] ,#[bold] #S #[default] }"

# Tab formatting: Flat highlighted tabs (zero round corners)
setw -g window-status-separator " "

# Inactive tab: clean text inheriting terminal background
setw -g window-status-format " #I #W "

# Active tab: clean high-contrast reverse highlight
setw -g window-status-current-format "#[reverse,bold] #I #W #[default]"

# Right section: Running turn indicator, clock, branding
set -g status-right-length 50
set -g status-right "#{?#{@agy_running},● RUNNING  ,}%H:%M agymux "

# -----------------------------------------------------------------------------
# 2. Prefix Definition (Ctrl+Space)
# -----------------------------------------------------------------------------
set -g prefix C-Space
bind-key C-Space send-prefix

# -----------------------------------------------------------------------------
# 3. Direct Tab Navigation (Prefix + 1..9 & Prefix + Arrows)
# -----------------------------------------------------------------------------
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9

bind-key Left  previous-window
bind-key Right next-window

# -----------------------------------------------------------------------------
# 4. Paired Bilingual Keybindings (English & RussianWin Layout Resilience)
# -----------------------------------------------------------------------------
# Switch Tab / Session (Ctrl+Space s / ы)
bind-key s display-popup -E -w 85% -h 75% "agymux switch"
bind-key ы display-popup -E -w 85% -h 75% "agymux switch"

# Switch Project (Ctrl+Space P / З)
bind-key P display-popup -E -w 85% -h 70% "agymux project"
bind-key З display-popup -E -w 85% -h 70% "agymux project"

# Command Palette (Ctrl+Space p / з)
bind-key p display-popup -E -w 75% -h 60% "agymux palette"
bind-key з display-popup -E -w 75% -h 60% "agymux palette"

# Keyboard Shortcuts Cheatsheet Modal (Ctrl+Space ? / h / р)
bind-key ? display-popup -E -w 75% -h 70% "agymux helper"
bind-key h display-popup -E -w 75% -h 70% "agymux helper"
bind-key р display-popup -E -w 75% -h 70% "agymux helper"

# New Tab (Ctrl+Space c / с)
bind-key c new-window -n "+ new" "agymux run"
bind-key с new-window -n "+ new" "agymux run"

# New Worktree Tab (Ctrl+Space w / ц)
bind-key w display-popup -E -w 65% -h 35% "agymux palette worktree"
bind-key ц display-popup -E -w 65% -h 35% "agymux palette worktree"

# Rename Tab (Ctrl+Space r / к)
bind-key r command-prompt -I "#W" "rename-window '%%'"
bind-key к command-prompt -I "#W" "rename-window '%%'"

# Fork Tab / Conversation (Ctrl+Space f / а)
bind-key f display-popup -E -w 65% -h 35% "agymux palette fork"
bind-key а display-popup -E -w 65% -h 35% "agymux palette fork"

# Launch with Custom Flags (Ctrl+Space l / д)
bind-key l display-popup -E -w 75% -h 55% "agymux palette flags"
bind-key д display-popup -E -w 75% -h 55% "agymux palette flags"

# Close Tab (Ctrl+Space x / ч)
bind-key x confirm-before -p "Close tab #W? (y/n)" kill-window
bind-key ч confirm-before -p "Close tab #W? (y/n)" kill-window

# Detach Session (Ctrl+Space d / в)
bind-key d detach-client
bind-key в detach-client

# Quit Cockpit (Keep Tabs Running) (Ctrl+Space q / й)
bind-key q detach-client
bind-key й detach-client

# Bind Conversation to Tab (Ctrl+Space b / и)
bind-key b display-popup -E -w 75% -h 60% "agymux bind"
bind-key и display-popup -E -w 75% -h 60% "agymux bind"

# New Plain Terminal Tab (Ctrl+Space t / е)
bind-key t new-window -n "term" "$SHELL"
bind-key е new-window -n "term" "$SHELL"

# Switch to Main Terminal Session (Ctrl+Space m / ь)
bind-key m run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
bind-key ь run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
