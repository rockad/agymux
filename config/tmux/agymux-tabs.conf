# agymux-tabs.conf: OpenCode-style top tab bar & keybindings for agymux

# 1. Top Tab Strip (OpenCode Aesthetic)
set -g status-position top

# Palette: Monokai Pro Octagon
#   bg:       #282a3a
#   bg_alt:   #3a3d4b
#   dim:      #696d77
#   active:   #bad761 (green)
#   purple:   #c39ac9
#   yellow:   #ffd76d

set -g status-style "bg=#282a3a,fg=#eaf2f1"
set -g status-left  "#[bg=#c39ac9,fg=#282a3a,bold] #S #[bg=#282a3a,fg=#282a3a]"
set -g status-left-length 28

setw -g window-status-format         "#[fg=#696d77] #I:#W "
setw -g window-status-current-format "#[bg=#3a3d4b,fg=#bad761,bold] #I:#W "

# 2. Direct Tab Switching (No prefix needed)
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

bind-key -n M-Left  previous-window
bind-key -n M-Right next-window

# 3. Floating Modal Switcher (Ctrl+Space s)
bind s display-popup -E -w 80% -h 65% "agymux-tab-picker"
bind ы display-popup -E -w 80% -h 65% "agymux-tab-picker"

# 4. New Tab (Ctrl+Space c)
bind c new-window -n "+ new" "agymux-tab-runner"
bind с new-window -n "+ new" "agymux-tab-runner"
